# =========================================================
# NutriFitLife - Configuración de la aplicación
# =========================================================

# Puerto del servidor
server.port=8080

# ---------------------------------------------------------
# Base de datos H2 en memoria
# ---------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:NutriFitLife;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2 accesible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------
# create-drop: crea el esquema al iniciar y lo elimina al cerrar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicializar datos de prueba desde data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---------------------------------------------------------
# CORS (origen permitido para el frontend Angular)
# ---------------------------------------------------------
cors.allowed-origins=http://localhost:4200

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------
logging.level.com.nutriFitLife=DEBUG
